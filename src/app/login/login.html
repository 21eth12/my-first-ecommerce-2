<div class="login-page">
  <div class="login-box">
    <h2 class="account-heading">MY ACCOUNT</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <input
        type="text"
        formControlName="email"
        placeholder="Please type your Email Address:"
      />
      <p class="error-text" *ngIf="emailValue.length > 0 && !(emailValue | validEmail)">
        Please enter a valid email address.
      </p>

      <input
        type="password"
        formControlName="password"
        placeholder="Please enter your Password:"
      />

      <a href="#" class="forgot-link">Forgotten Your Password</a>

      <button type="submit" [disabled]="loginForm.invalid || !(emailValue | validEmail)">
        LOG IN
      </button>
    </form>

    <div class="or-divider">- OR -</div>

    <div class="social-buttons">
      <button type="button">Sign in using Google</button>
      <button type="button">Sign in using Microsoft</button>
      <button type="button">Sign in using Apple</button>
    </div>
  </div>
</div>
